<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celular Kits - Ventas y Comisiones</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --success-color: #28a745;
      --danger-color: #dc3545;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
      text-align: center;
      color: var(--primary-color);
    }

    .badge-semana {
      background-color: var(--primary-color);
      color: #fff;
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 0.9em;
      display: inline-block;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    button:hover {
      background-color: #004085;
    }

    .resultado-card {
      margin-top: 25px;
      padding: 20px;
      border-radius: 8px;
      background: #e9ecef;
    }

    .status-badge {
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      color: white;
    }

    .status-success { background-color: var(--success-color); }
    .status-danger { background-color: var(--danger-color); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Celular Kits - Módulo de Ventas</h1>
    <div style="text-align: center;">
      <span class="badge-semana">Semana Activa: 34</span>
    </div>

    <form id="formComisiones">
      <div class="form-group">
        <label for="nombreAsesor">Nombre del Asesor:</label>
        <input type="text" id="nombreAsesor" placeholder="Ej. Juan Pérez" required>
      </div>

      <div class="form-group">
        <label for="puntoVenta">Punto de Venta PayJoy:</label>
        <input type="text" id="puntoVenta" placeholder="Ej. Isla Río Grande" required>
      </div>

      <div class="form-group">
        <label for="ventasTotales">Ventas Totales ($):</label>
        <input type="number" id="ventasTotales" min="0" step="0.01" placeholder="0.00" required>
      </div>

      <div class="form-group">
        <label for="metaMinima">Meta Mínima de Ventas ($):</label>
        <input type="number" id="metaMinima" min="0" step="0.01" placeholder="0.00" required>
      </div>

      <div class="form-group">
        <label for="montoBono">Monto del Bono de Productividad ($):</label>
        <input type="number" id="montoBono" min="0" step="0.01" placeholder="0.00" required>
      </div>

      <div class="form-group">
        <label for="sueldoBase">Sueldo Base ($):</label>
        <input type="number" id="sueldoBase" min="0" step="0.01" value="0" placeholder="0.00">
      </div>

      <button type="button" onclick="procesarCalculo()">Calcular e Integrar</button>
    </form>

    <div id="resultado" class="resultado-card" style="display: none;"></div>
  </div>

  <script>
    // Configuración general
    const SEMANA_ACTUAL = 34;
    const PORCENTAJE_COMISION = 0.025; // 2.5% sobre la venta total

    /**
     * Función principal de cálculo ajustada a las reglas actuales
     */
    function calcularComisionesCelularKits(datos) {
      const ventasTotales = Number(datos.ventasTotales) || 0;
      const metaMinima = Number(datos.metaMinima) || 0;
      const montoBono = Number(datos.montoBono) || 0;
      const sueldoBase = Number(datos.sueldoBase) || 0;

      // 1. Comisión: Siempre 2.5% sobre el total de ventas
      const comision = ventasTotales * PORCENTAJE_COMISION;

      // 2. Bono de productividad: Únicamente si se alcanza o supera la meta mínima PayJoy
      const alcanzoMeta = ventasTotales >= metaMinima;
      const bonoProductividad = alcanzoMeta ? montoBono : 0;

      // 3. Ingreso total integrado
      const totalPagar = sueldoBase + comision + bonoProductividad;

      return {
        semana: SEMANA_ACTUAL,
        nombreAsesor: datos.nombreAsesor || 'Asesor',
        puntoVenta: datos.puntoVenta || 'Punto PayJoy',
        ventasTotales: ventasTotales,
        metaMinima: metaMinima,
        alcanzoMeta: alcanzoMeta,
        comision: comision,
        bonoProductividad: bonoProductividad,
        sueldoBase: sueldoBase,
        totalPagar: totalPagar
      };
    }

    function procesarCalculo() {
      const datos = {
        nombreAsesor: document.getElementById('nombreAsesor').value,
        puntoVenta: document.getElementById('puntoVenta').value,
        ventasTotales: document.getElementById('ventasTotales').value,
        metaMinima: document.getElementById('metaMinima').value,
        montoBono: document.getElementById('montoBono').value,
        sueldoBase: document.getElementById('sueldoBase').value
      };

      const res = calcularComisionesCelularKits(datos);

      const contenedorResultado = document.getElementById('resultado');
      contenedorResultado.style.display = 'block';
      contenedorResultado.innerHTML = `
        <h2>Resumen de Pago (Semana ${res.semana})</h2>
        <p><strong>Asesor:</strong> ${res.nombreAsesor}</p>
        <p><strong>Punto de Venta:</strong> ${res.puntoVenta}</p>
        <hr>
        <p><strong>Ventas Totales:</strong> $${res.ventasTotales.toLocaleString('es-MX', {minimumFractionDigits: 2})}</p>
        <p><strong>Meta Mínima:</strong> $${res.metaMinima.toLocaleString('es-MX', {minimumFractionDigits: 2})}</p>
        <p><strong>Comisión Generada (2.5%):</strong> $${res.comision.toFixed(2)}</p>
        <p>
          <strong>Bono de Productividad:</strong> $${res.bonoProductividad.toFixed(2)} 
          <span class="status-badge ${res.alcanzoMeta ? 'status-success' : 'status-danger'}">
            ${res.alcanzoMeta ? 'Meta Alcanzada' : 'Meta No Alcanzada'}
          </span>
        </p>
        <p><strong>Sueldo Base:</strong> $${res.sueldoBase.toFixed(2)}</p>
        <hr>
        <h3>Total a Pagar: $${res.totalPagar.toFixed(2)}</h3>
      `;
    }
  </script>
</body>
</html>
