<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category Grid</title>
<style>
  /* Container setup */
  .category-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    padding: 16px;
    max-width: 800px;
    margin: 0 auto;
  }

  /* Responsive adjustment for mobile screens */
  @media (max-width: 600px) {
    .category-grid {
      grid-template-columns: 1fr;
    }
  }

  /* Individual grid cell styling */
  .grid-cell {
    position: relative;
    height: 200px;
    background-image: url('https://placehold.co/600x400/eeeeee/cccccc?text=Background');
    background-size: cover;
    background-position: center;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* Text layered above the overlay */
  .cell-text {
    position: relative;
    z-index: 2;
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 1.5rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    pointer-events: none; /* Allows hover to trigger anywhere on the cell */
  }

  /* Overlay configuration */
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0.6;
    transition: opacity 0.3s ease;
    z-index: 1;
  }

  /* Hover trigger */
  .grid-cell:hover .overlay {
    opacity: 0.9;
  }

  /* Specific overlay colors */
  .overlay-blue { background-color: #0d6efd; }
  .overlay-green { background-color: #198754; }
  .overlay-purple { background-color: #6f42c1; }
  .overlay-orange { background-color: #fd7e14; }
</style>
</head>
<body>

<div class="category-grid">
  <!-- Blue Cell -->
  <div class="grid-cell">
    <div class="overlay overlay-blue"></div>
    <span class="cell-text">Celularkits</span>
  </div>

  <!-- Green Cell -->
  <div class="grid-cell">
    <div class="overlay overlay-green"></div>
    <span class="cell-text">Toska</span>
  </div>

  <!-- Purple Cell -->
  <div class="grid-cell">
    <div class="overlay overlay-purple"></div>
    <span class="cell-text">Shota</span>
  </div>

  <!-- Orange Cell -->
  <div class="grid-cell">
    <div class="overlay overlay-orange"></div>
    <span class="cell-text">Cocos</span>
  </div>
</div>

</body>
</html>
